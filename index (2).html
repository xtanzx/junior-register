<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>জগতপুর সাধনা উচ্চ বিদ্যালয় | প্লাটিনাম জুবিলি-২০২৬</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#f7f9fc,#eaf0f7);font-family:"Noto Sans Bengali","SolaimanLipi",Arial,sans-serif;color:#172033}
.wrap{width:min(720px,94%);margin:auto;padding:18px 0 40px}
.card{background:#fff;border:1px solid #e1e7ef;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px rgba(20,40,70,.12)}
.head{text-align:center;padding:25px 18px 12px}
.logo{display:block;width:min(245px,65vw);max-height:250px;object-fit:contain;margin:0 auto 10px}
h1{font-size:clamp(21px,5vw,30px);margin:4px 0;color:#102a56}
h2{font-size:clamp(18px,4.5vw,24px);margin:4px 0;color:#8b5a00}
.sub{color:#667085;font-size:15px;margin-top:8px}
form{padding:18px 24px 28px}
.field{margin-bottom:17px}
label{display:block;font-weight:700;margin-bottom:7px;color:#26364f}
.req{color:#c62828}
input,select{width:100%;padding:13px 14px;border:1px solid #cfd7e3;border-radius:11px;font-size:16px;background:#fff;outline:none}
input:focus,select:focus{border-color:#315c9b;box-shadow:0 0 0 3px rgba(49,92,155,.12)}
input[type=file]{padding:10px}
.hint{font-size:12px;color:#737d8d;margin-top:6px}
.preview{display:none;text-align:center;margin-top:12px}
.preview img{max-width:160px;max-height:190px;border-radius:12px;border:1px solid #d5dce6}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#123d78;color:white;font-size:17px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6}
.msg{display:none;margin-top:15px;padding:14px;border-radius:11px;text-align:center;font-weight:700}
.err{background:#fff0f0;color:#a51f1f}
.ok{background:#eefaf2;color:#176b36}
.reg{font-size:25px;margin:8px 0;letter-spacing:1px}
.foot{text-align:center;color:#788294;font-size:12px;padding:0 15px 22px}
@media(max-width:520px){.wrap{width:96%;padding-top:8px}.card{border-radius:16px}form{padding:15px 16px 22px}.head{padding-top:18px}.logo{width:210px}}
</style>

<div class="field"><label>টিশার্ট সাইজ <span class="req">*</span></label>
<select id="size" required><option value="">সাইজ নির্বাচন করুন</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>3XL</option></select></div>
<div class="field"><label>ফোন নম্বর <span class="req">*</span></label><input id="phone" type="tel" inputmode="tel" required maxlength="20" placeholder="যেমন: ০১৭১২৩৪৫৬৭৮"></div>
<div class="field"><label>শিক্ষার্থীর ছবি <span class="req">*</span></label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
<div class="hint">JPG, PNG অথবা WEBP • সর্বোচ্চ ৫ MB</div>
<div class="preview" id="prev"><img id="pimg"></div></div>
<button id="btn">রেজিস্ট্রেশন সম্পন্ন করুন</button>
<div id="err" class="msg err"></div>
<div id="ok" class="msg ok"><div>রেজিস্ট্রেশন সফল হয়েছে</div><div id="reg" class="reg"></div><div id="who"></div></div>
</form>
<div class="foot">জগতপুর সাধনা উচ্চ বিদ্যালয় • প্লাটিনাম জুবিলি-২০২৬</div>
</div></div>

<script>
// ⚠️ এখানে আপনার Apps Script Web App URL বসান (…/exec দিয়ে শেষ হওয়া লিংক)
const API_URL='PASTE_YOUR_WEB_APP_URL_HERE';
const f=document.getElementById('f'),photo=document.getElementById('photo'),prev=document.getElementById('prev'),pimg=document.getElementById('pimg'),btn=document.getElementById('btn'),err=document.getElementById('err'),ok=document.getElementById('ok');
photo.onchange=()=>{const x=photo.files[0];err.style.display='none';if(!x){prev.style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(x.type)){showErr('শুধু JPG, PNG অথবা WEBP ছবি দিন।');photo.value='';return}if(x.size>5*1024*1024){showErr('ছবির আকার সর্বোচ্চ ৫ MB হতে হবে।');photo.value='';return}const r=new FileReader();r.onload=e=>{pimg.src=e.target.result;prev.style.display='block'};r.readAsDataURL(x)};
f.onsubmit=e=>{e.preventDefault();err.style.display='none';ok.style.display='none';const x=photo.files[0];if(!x){showErr('শিক্ষার্থীর ছবি নির্বাচন করুন।');return}if(API_URL.indexOf('PASTE_')===0){showErr('API_URL এখনো সেট করা হয়নি। index.html এ Web App URL বসান।');return}btn.disabled=true;btn.textContent='রেজিস্ট্রেশন সংরক্ষণ হচ্ছে...';const r=new FileReader();r.onload=()=>{
    const payload={name:document.getElementById('name').value.trim(),studentClass:document.getElementById('cls').value,section:document.getElementById('section').value,roll:document.getElementById('roll').value.trim(),phone:document.getElementById('phone').value.trim(),bloodGroup:document.getElementById('blood').value,tShirtSize:document.getElementById('size').value,imageData:r.result,imageName:x.name};
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .then(resp=>resp.json())
      .then(res=>{
        if(res&&res.success){document.getElementById('reg').textContent=res.registrationNo;document.getElementById('who').textContent=res.name+' — আপনার নিবন্ধন সম্পন্ন হয়েছে।';ok.style.display='block';f.reset();prev.style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
        else showErr((res&&res.error)||'রেজিস্ট্রেশন সম্পন্ন করা যায়নি।');
      })
      .catch(()=>showErr('সংযোগে সমস্যা হয়েছে। ইন্টারনেট চেক করে আবার চেষ্টা করুন।'))
      .finally(()=>{btn.disabled=false;btn.textContent='রেজিস্ট্রেশন সম্পন্ন করুন'});
  };
  r.readAsDataURL(x)};
function showErr(t){err.textContent=t;err.style.display='block';ok.style.display='none'}
</script>
</body></html>
